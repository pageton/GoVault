name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go vet ./... ./test/... ./examples/...
      - run: go test -race -count=1 ./... ./test/...
      - run: go run ./examples/basic
      - run: go run ./examples/batch-scan
      - run: go run ./examples/concurrent
      - run: go run ./examples/customdriver
      - run: go run ./examples/ttl
      - run: go test -run '^$' -bench . -benchmem -count=1 ./test/...
