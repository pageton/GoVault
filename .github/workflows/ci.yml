name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ['stable', 'oldstable']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run ./examples/basic
      - run: go run ./examples/batch-scan
      - run: go run ./examples/concurrent
      - run: go run ./examples/customdriver
      - run: go run ./examples/ttl
      - run: go test -run '^$' -bench . -benchmem -count=1 ./...
